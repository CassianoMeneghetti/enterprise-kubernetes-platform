apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-enterprise-platform
  namespace: monitoring
  labels:
    app: grafana

data:
  enterprise-platform-overview.json: |
    {"uid":"enterprise-platform-overview","title":"Enterprise Platform Overview","schemaVersion":39,"refresh":"15s","tags":["enterprise-platform","overview"],"time":{"from":"now-1h","to":"now"},"panels":[
    {"id":1,"type":"stat","title":"API Status","gridPos":{"x":0,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(up{job=\"enterprise-api\"})","refId":"A"}]},
    {"id":2,"type":"stat","title":"API Pods Ready","gridPos":{"x":4,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(kube_pod_status_ready{namespace=\"production\",condition=\"true\",pod=~\"enterprise-api-.*\"})","refId":"A"}]},
    {"id":3,"type":"stat","title":"Frontend Pods Ready","gridPos":{"x":8,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(kube_pod_status_ready{namespace=\"production\",condition=\"true\",pod=~\"enterprise-frontend-.*\"})","refId":"A"}]},
    {"id":4,"type":"stat","title":"PostgreSQL","gridPos":{"x":12,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(pg_up)","refId":"A"}]},
    {"id":5,"type":"stat","title":"Redis","gridPos":{"x":16,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(redis_up)","refId":"A"}]},
    {"id":6,"type":"stat","title":"Restarts 15m","gridPos":{"x":20,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total{namespace=\"production\"}[15m]))","refId":"A"}]},
    {"id":7,"type":"timeseries","title":"Requests / Second","gridPos":{"x":0,"y":4,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(enterprise_http_requests_total[5m])) by (route)","legendFormat":"{{route}}","refId":"A"}]},
    {"id":8,"type":"timeseries","title":"API Error Rate","gridPos":{"x":8,"y":4,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(enterprise_http_requests_total{status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(enterprise_http_requests_total[5m])), 0.001)","refId":"A"}]},
    {"id":9,"type":"timeseries","title":"API p95 Latency","gridPos":{"x":16,"y":4,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(enterprise_http_request_duration_seconds_bucket[5m])) by (le, route))","legendFormat":"{{route}}","refId":"A"}]},
    {"id":10,"type":"timeseries","title":"CPU by Workload","gridPos":{"x":0,"y":11,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"production\",container!=\"\",pod!=\"\"}[5m])) by (pod)","legendFormat":"{{pod}}","refId":"A"}]},
    {"id":11,"type":"timeseries","title":"Memory by Workload","gridPos":{"x":12,"y":11,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(container_memory_working_set_bytes{namespace=\"production\",container!=\"\",pod!=\"\"}) by (pod)","legendFormat":"{{pod}}","refId":"A"}]}]}
  enterprise-api.json: |
    {"uid":"enterprise-api","title":"Enterprise API","schemaVersion":39,"refresh":"15s","tags":["enterprise-platform","api"],"time":{"from":"now-1h","to":"now"},"panels":[
    {"id":1,"type":"timeseries","title":"Requests by Route","gridPos":{"x":0,"y":0,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(enterprise_http_requests_total[5m])) by (route)","legendFormat":"{{route}}","refId":"A"}]},
    {"id":2,"type":"timeseries","title":"Requests by Method","gridPos":{"x":8,"y":0,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(enterprise_http_requests_total[5m])) by (method)","legendFormat":"{{method}}","refId":"A"}]},
    {"id":3,"type":"timeseries","title":"Requests by Status","gridPos":{"x":16,"y":0,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(enterprise_http_requests_total[5m])) by (status_code)","legendFormat":"{{status_code}}","refId":"A"}]},
    {"id":4,"type":"timeseries","title":"Latency p50 / p95 / p99","gridPos":{"x":0,"y":7,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.50, sum(rate(enterprise_http_request_duration_seconds_bucket[5m])) by (le))","legendFormat":"p50","refId":"A"},{"expr":"histogram_quantile(0.95, sum(rate(enterprise_http_request_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95","refId":"B"},{"expr":"histogram_quantile(0.99, sum(rate(enterprise_http_request_duration_seconds_bucket[5m])) by (le))","legendFormat":"p99","refId":"C"}]},
    {"id":5,"type":"timeseries","title":"4xx and 5xx","gridPos":{"x":12,"y":7,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(enterprise_http_requests_total{status_code=~\"4..\"}[5m]))","legendFormat":"4xx","refId":"A"},{"expr":"sum(rate(enterprise_http_requests_total{status_code=~\"5..\"}[5m]))","legendFormat":"5xx","refId":"B"}]},
    {"id":6,"type":"stat","title":"Requests In Flight","gridPos":{"x":20,"y":7,"w":4,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(enterprise_http_requests_in_flight)","refId":"A"}]}]}
  postgresql.json: |
    {"uid":"enterprise-postgresql","title":"PostgreSQL","schemaVersion":39,"refresh":"30s","tags":["enterprise-platform","postgresql"],"time":{"from":"now-1h","to":"now"},"panels":[
    {"id":1,"type":"stat","title":"PostgreSQL UP","gridPos":{"x":0,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(pg_up)","refId":"A"}]},
    {"id":2,"type":"timeseries","title":"Connections","gridPos":{"x":4,"y":0,"w":10,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(pg_stat_activity_count) by (state)","legendFormat":"{{state}}","refId":"A"}]},
    {"id":3,"type":"timeseries","title":"Commits / Rollbacks","gridPos":{"x":14,"y":0,"w":10,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(pg_stat_database_xact_commit{datname=\"enterprise\"}[5m])","legendFormat":"commits","refId":"A"},{"expr":"rate(pg_stat_database_xact_rollback{datname=\"enterprise\"}[5m])","legendFormat":"rollbacks","refId":"B"}]},
    {"id":4,"type":"timeseries","title":"Locks","gridPos":{"x":0,"y":7,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(pg_locks_count) by (mode)","legendFormat":"{{mode}}","refId":"A"}]},
    {"id":5,"type":"timeseries","title":"Deadlocks","gridPos":{"x":12,"y":7,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"increase(pg_stat_database_deadlocks{datname=\"enterprise\"}[15m])","refId":"A"}]}]}
  redis.json: |
    {"uid":"enterprise-redis","title":"Redis","schemaVersion":39,"refresh":"30s","tags":["enterprise-platform","redis"],"time":{"from":"now-1h","to":"now"},"panels":[
    {"id":1,"type":"stat","title":"Redis UP","gridPos":{"x":0,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(redis_up)","refId":"A"}]},
    {"id":2,"type":"timeseries","title":"Memory Used","gridPos":{"x":4,"y":0,"w":10,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"redis_memory_used_bytes","refId":"A"}]},
    {"id":3,"type":"timeseries","title":"Connected Clients","gridPos":{"x":14,"y":0,"w":10,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"redis_connected_clients","refId":"A"}]},
    {"id":4,"type":"timeseries","title":"Commands / Second","gridPos":{"x":0,"y":7,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(redis_commands_processed_total[5m])","refId":"A"}]},
    {"id":5,"type":"timeseries","title":"Cache Hits / Misses","gridPos":{"x":8,"y":7,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(redis_keyspace_hits_total[5m])","legendFormat":"hits","refId":"A"},{"expr":"rate(redis_keyspace_misses_total[5m])","legendFormat":"misses","refId":"B"}]},
    {"id":6,"type":"timeseries","title":"Keyspace Keys","gridPos":{"x":16,"y":7,"w":8,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(redis_db_keys) by (db)","legendFormat":"{{db}}","refId":"A"}]}]}
  kubernetes.json: |
    {"uid":"enterprise-kubernetes","title":"Kubernetes","schemaVersion":39,"refresh":"30s","tags":["enterprise-platform","kubernetes"],"time":{"from":"now-1h","to":"now"},"panels":[
    {"id":1,"type":"stat","title":"Nodes","gridPos":{"x":0,"y":0,"w":4,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"count(kube_node_info)","refId":"A"}]},
    {"id":2,"type":"stat","title":"Production Pods Running","gridPos":{"x":4,"y":0,"w":5,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(kube_pod_status_phase{namespace=\"production\",phase=\"Running\"})","refId":"A"}]},
    {"id":3,"type":"stat","title":"Deployments Available","gridPos":{"x":9,"y":0,"w":5,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(kube_deployment_status_replicas_available{namespace=\"production\"})","refId":"A"}]},
    {"id":4,"type":"stat","title":"Restarts 1h","gridPos":{"x":14,"y":0,"w":5,"h":4},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total{namespace=\"production\"}[1h]))","refId":"A"}]},
    {"id":5,"type":"timeseries","title":"CPU by Namespace","gridPos":{"x":0,"y":4,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{container!=\"\",pod!=\"\"}[5m])) by (namespace)","legendFormat":"{{namespace}}","refId":"A"}]},
    {"id":6,"type":"timeseries","title":"Memory by Namespace","gridPos":{"x":12,"y":4,"w":12,"h":7},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(container_memory_working_set_bytes{container!=\"\",pod!=\"\"}) by (namespace)","legendFormat":"{{namespace}}","refId":"A"}]}]}
  logs.json: |
    {"uid":"enterprise-logs","title":"Enterprise Logs","schemaVersion":39,"refresh":"15s","tags":["enterprise-platform","logs","loki"],"time":{"from":"now-30m","to":"now"},"panels":[
    {"id":1,"type":"logs","title":"Enterprise API Logs","gridPos":{"x":0,"y":0,"w":12,"h":10},"datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"production\", app=\"enterprise-api\"}","refId":"A"}]},
    {"id":2,"type":"logs","title":"Frontend Logs","gridPos":{"x":12,"y":0,"w":12,"h":10},"datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"production\", app=\"enterprise-frontend\"}","refId":"A"}]},
    {"id":3,"type":"logs","title":"PostgreSQL Logs","gridPos":{"x":0,"y":10,"w":12,"h":10},"datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"production\", app=\"postgresql\"}","refId":"A"}]},
    {"id":4,"type":"logs","title":"Redis Logs","gridPos":{"x":12,"y":10,"w":12,"h":10},"datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"production\", app=\"redis\"}","refId":"A"}]}]}
