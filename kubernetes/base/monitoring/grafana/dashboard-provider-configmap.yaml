apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Enterprise Platform
        orgId: 1
        folder: Enterprise Platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
