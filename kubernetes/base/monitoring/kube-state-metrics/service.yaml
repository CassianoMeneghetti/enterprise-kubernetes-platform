apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics

spec:
  type: ClusterIP

  selector:
    app: kube-state-metrics

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: telemetry
      protocol: TCP
      port: 8081
      targetPort: 8081
