apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-frontend
  namespace: production
  labels:
    app: enterprise-frontend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: enterprise-frontend

  template:
    metadata:
      labels:
        app: enterprise-frontend

    spec:
      containers:
        - name: enterprise-frontend
          image: enterprise-platform-frontend:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
