apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: production
  labels:
    app: postgresql

spec:
  serviceName: postgresql
  replicas: 1

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql

    spec:
      serviceAccountName: postgresql-sa
      automountServiceAccountToken: false

      containers:
        - name: postgresql
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432

          envFrom:
            - configMapRef:
                name: postgresql-config
            - secretRef:
                name: postgresql-secret

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - enterprise_app
                - -d
                - enterprise
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - enterprise_app
                - -d
                - enterprise
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app: postgresql
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
