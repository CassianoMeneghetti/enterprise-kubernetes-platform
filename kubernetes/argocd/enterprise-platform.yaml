apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/CassianoMeneghetti/enterprise-kubernetes-platform.git
    targetRevision: main
    path: kubernetes/base

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: production