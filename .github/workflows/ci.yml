name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - kubernetes/base/backend/deployment.yaml
      - kubernetes/base/frontend/deployment.yaml
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/backend/package-lock.json

      - name: Install dependencies
        working-directory: applications/backend
        run: npm ci

      - name: Detect npm scripts
        working-directory: applications/backend
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const scripts = require("./package.json").scripts || {};
          const hasRealTest = Boolean(scripts.test && !scripts.test.includes("no test specified"));
          console.log(`HAS_BACKEND_TEST=${hasRealTest}`);
          console.log(`HAS_BACKEND_LINT=${Boolean(scripts.lint)}`);
          NODE

      - name: Run backend tests
        if: env.HAS_BACKEND_TEST == 'true'
        working-directory: applications/backend
        run: npm test

      - name: Skip backend tests
        if: env.HAS_BACKEND_TEST != 'true'
        run: echo "No real backend test script found; skipping."

      - name: Run backend lint
        if: env.HAS_BACKEND_LINT == 'true'
        working-directory: applications/backend
        run: npm run lint

      - name: Skip backend lint
        if: env.HAS_BACKEND_LINT != 'true'
        run: echo "No backend lint script found; skipping."

      - name: Validate backend syntax
        working-directory: applications/backend
        run: node --check server.js

      - name: Validate backend startup
        working-directory: applications/backend
        run: |
          set -euo pipefail
          npm start > /tmp/enterprise-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:3000/health

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static frontend files
        run: |
          set -euo pipefail
          test -s applications/frontend/index.html
          test -s applications/frontend/styles.css
          test -s applications/frontend/app.js
          test -s applications/frontend/nginx.conf
          grep -q "/api/status" applications/frontend/app.js
          grep -q "Enterprise Platform" applications/frontend/index.html

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t enterprise-platform-api:ci applications/backend

      - name: Build frontend image
        run: docker build -t enterprise-platform-frontend:ci applications/frontend

  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker-build
      - kubernetes
      - secret-hygiene
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(gitops): deploy') }}"
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: enterprise-platform-api
            context: applications/backend
            dockerfile: applications/backend/Dockerfile
            title: Enterprise Platform API
          - name: enterprise-platform-frontend
            context: applications/frontend
            dockerfile: applications/frontend/Dockerfile
            title: Enterprise Platform Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cassianomeneghetti/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops-update:
    name: GitOps Image Update
    runs-on: ubuntu-latest
    needs:
      - publish-images
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(gitops): deploy') }}"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Avoid stale image updates
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "origin/main advanced to ${remote_sha}; skipping GitOps update for ${GITHUB_SHA}."
            exit 0
          fi

      - name: Update Kubernetes image references
        env:
          API_IMAGE: ghcr.io/cassianomeneghetti/enterprise-platform-api:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/cassianomeneghetti/enterprise-platform-frontend:${{ github.sha }}
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          updates = {
            "kubernetes/base/backend/deployment.yaml" => ENV.fetch("API_IMAGE"),
            "kubernetes/base/frontend/deployment.yaml" => ENV.fetch("FRONTEND_IMAGE")
          }

          updates.each do |file, image|
            content = File.read(file)
            updated = content.sub(/^(\s*image:\s*).+$/, "\\1#{image}")

            if updated == content
              raise "No image field was updated in #{file}"
            end

            File.write(file, updated)
          end
          RUBY

      - name: Commit GitOps image update
        run: |
          set -euo pipefail
          if git diff --quiet -- kubernetes/base/backend/deployment.yaml kubernetes/base/frontend/deployment.yaml; then
            echo "Kubernetes manifests already reference ${GITHUB_SHA}; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/base/backend/deployment.yaml kubernetes/base/frontend/deployment.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main

  kubernetes:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; files = IO.popen(['git', 'ls-files', '*.yml', '*.yaml'], &:read).split(\"\n\").reject { |file| file.end_with?('.local.yaml') }; files.each { |file| YAML.load_stream(File.read(file)) }; puts \"Validated #{files.length} YAML files.\""

      - name: Install kubeconform
        run: |
          set -euo pipefail
          version="0.6.7"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          mapfile -t manifests < <(git ls-files 'kubernetes/base/*.yaml' 'kubernetes/base/**/*.yaml' | grep -vE '(^|/)(secret\.local\.yaml|.*-secret\.local\.yaml)$')
          kubeconform -strict -ignore-missing-schemas -summary "${manifests[@]}"

  secret-hygiene:
    name: Secret Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure local secrets are not tracked
        run: |
          set -euo pipefail
          blocked_files="$(git ls-files | grep -E '(^|/)(secret\.local\.yaml|.*-secret\.local\.yaml|live-postgresql-config\.yaml)$' || true)"
          if [ -n "$blocked_files" ]; then
            echo "::error::Local secret or live configuration files are tracked:"
            echo "$blocked_files"
            exit 1
          fi
          echo "No local secret or live configuration files are tracked."
