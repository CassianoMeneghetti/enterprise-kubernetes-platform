apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx

spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: ingress-nginx
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/part-of: ingress-nginx
        app.kubernetes.io/version: 1.15.1

    spec:
      nodeSelector:
        kubernetes.io/hostname: enterprise-k8s-control-plane
        kubernetes.io/os: linux

      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Equal
          effect: NoSchedule

        - key: node-role.kubernetes.io/control-plane
          operator: Equal
          effect: NoSchedule

      serviceAccountName: ingress-nginx

      containers:
        - name: controller
          image: registry.k8s.io/ingress-nginx/controller:v1.15.1@sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1

          args:
            - /nginx-ingress-controller
            - --election-id=ingress-nginx-leader
            - --controller-class=k8s.io/ingress-nginx
            - --ingress-class=nginx
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
            - --validating-webhook=:8443
            - --validating-webhook-certificate=/usr/local/certificates/cert
            - --validating-webhook-key=/usr/local/certificates/key
            - --watch-ingress-without-class=true
            - --publish-status-address=localhost

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: LD_PRELOAD
              value: /usr/local/lib/libmimalloc.so

          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP

            - name: https
              containerPort: 443
              hostPort: 443
              protocol: TCP

            - name: webhook
              containerPort: 8443
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /healthz
              port: 10254
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 10254
            initialDelaySeconds: 10
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 82
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: webhook-cert
              mountPath: /usr/local/certificates/
              readOnly: true

      volumes:
        - name: webhook-cert
          secret:
            secretName: ingress-nginx-admission

      terminationGracePeriodSeconds: 0